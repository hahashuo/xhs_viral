<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: {{width}}px; height: {{height}}px; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
    background: #FBF7F0; color: #1F1F1F;
    padding: 120px 96px; display: flex; flex-direction: column;
  }
  .tag { font-size: 34px; color: #C2410C; letter-spacing: 2px; margin-bottom: 40px; }
  h1 { font-size: 84px; line-height: 1.25; font-weight: 800; margin-bottom: 64px; }
  ul { list-style: none; display: flex; flex-direction: column; gap: 40px; }
  li { font-size: 46px; line-height: 1.5; padding-left: 48px; position: relative; }
  li::before { content: ""; position: absolute; left: 0; top: 26px; width: 18px; height: 18px; border-radius: 50%; background: #C2410C; }
  .foot { margin-top: auto; font-size: 30px; color: #8A8178; display: flex; justify-content: space-between; }
</style>
</head>
<body>
  <div class="tag">{{niche}}</div>
  <h1>{{heading}}</h1>
  <ul>{{items}}</ul>
  <div class="foot"><span>{{page}}</span><span></span></div>
</body>
</html>
